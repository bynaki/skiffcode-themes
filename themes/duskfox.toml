# Duskfox, converted to a Skiff Code theme.
# Source: https://github.com/EdenEast/nightfox.nvim at 4dacd3f0185a2227bdf3b6c0975a8f0bf87cac9a,
#   the highlight groups of :colorscheme duskfox, read in Neovim v0.12.4
# License: MIT, Copyright (c) 2021 James Simpson. The full text is in NOTICE.md of
#   https://github.com/bynaki/skiffcode-themes, written by scripts/generate.ts there from scripts/data/nightfox.json.
# The comment after each color names what in the source it came from.
base = "dark"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#191726" # NormalFloat bg
foreground = "#e0def4" # NormalFloat fg
muted = "#817c9c" # Comment fg
border = "#6e6a86" # FloatBorder fg
faint = "#4b4673" # NonText fg
subtle = "#373354" # CursorLine bg
accent = "#65b1cd" # Function fg
scrim = "#23213699" # none in the source: editor.background at alpha 99
strong_background = "#63577d" # PmenuSel bg
strong_foreground = "#e0def4" # Pmenu fg
git_modified = "#f6c177" # NvimTreeGitDirty fg
git_untracked = "#a3be8c" # NvimTreeGitNew fg

# The document: the code views and rendered markdown.
[editor]
background = "#232136" # Normal bg
foreground = "#e0def4" # Normal fg
gutter_background = "#232136" # none in the source: editor.background
gutter_foreground = "#6e6a86" # LineNr fg
gutter_border = "#191726" # WinSeparator fg
cursor = "#e0def4" # Cursor bg
selection = "#433c59" # Visual bg
code_background = "#2d2a45" # ColorColumn bg

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#c4a7e7" # @keyword fg (via Keyword)
atom = "#ea9a97" # @boolean fg (via Number)
literal = "#ea9a97" # @number fg (via Number)
string = "#a3be8c" # @string fg (via String)
regexp = "#f9cb8c" # @string.regexp fg
definition = "#65b1cd" # @function fg (via Function)
local = "#a6dae3" # @variable.parameter fg
type = "#f6c177" # @type fg (via Type)
class = "#f6c177" # @lsp.type.class fg (via Type)
macro = "#eb6f92" # @function.macro fg
property = "#569fba" # @property fg
comment = "#817c9c" # @comment fg (via Comment)
meta = "#f0a4a2" # @attribute fg (via Constant)
invalid = "#eb6f92" # DiagnosticError fg
warning = "#f6c177" # DiagnosticWarn fg

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#a3be8c" # GitSignsAdd fg
removed = "#eb6f92" # GitSignsDelete fg
changed = "#f6c177" # GitSignsChange fg
