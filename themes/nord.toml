# Nord, converted to a Skiff Code theme.
# Source: https://github.com/nordtheme/visual-studio-code at 8ead09822c02d0d49d0f764104505e5a34d3689f,
#   themes/nord-color-theme.json
# License: MIT, Copyright (c) 2016-present Sven Greb <development@svengreb.de> (https://www.svengreb.de). The full text is in NOTICE.md of
#   https://github.com/bynaki/skiffcode-themes, written by scripts/generate.ts there from scripts/data/nord.json.
# The comment after each color names what in the source it came from.
base = "dark"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#2e3440" # sideBar.background
foreground = "#d8dee9" # sideBar.foreground
muted = "#d8dee9e6" # descriptionForeground
border = "#3b4252" # panel.border
faint = "#cccccc80" # disabledForeground: VS Code's default for a dark theme
subtle = "#3b4252" # list.hoverBackground
accent = "#3b4252" # focusBorder
scrim = "#2e344099" # none in the source: editor.background at alpha 99
strong_background = "#88c0d0ee" # button.background
strong_foreground = "#2e3440" # button.foreground
git_modified = "#ebcb8b" # gitDecoration.modifiedResourceForeground
git_untracked = "#a3be8c" # gitDecoration.untrackedResourceForeground

# The document: the code views and rendered markdown.
[editor]
background = "#2e3440" # editor.background
foreground = "#d8dee9" # editor.foreground
gutter_background = "#2e3440" # editorGutter.background
gutter_foreground = "#4c566a" # editorLineNumber.foreground
gutter_border = "#3b425201" # editorGroup.border
cursor = "#d8dee9" # editorCursor.foreground
selection = "#434c5ecc" # editor.selectionBackground
code_background = "#4c566a" # textCodeBlock.background

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#81a1c1" # token keyword (for keyword.control)
atom = "#81a1c1" # token constant.language (for constant.language)
literal = "#b48ead" # token constant.numeric (for constant.numeric)
string = "#a3be8c" # token string (for string.quoted)
regexp = "#ebcb8b" # token string.regexp (for string.regexp)
definition = "#88c0d0" # token entity.name.function (for entity.name.function)
local = "#d8dee9" # token variable.parameter (for variable.parameter)
type = "#8fbcbb" # token support.type (for support.type)
class = "#8fbcbb" # token entity.name.class (for entity.name.class)
macro = "#88c0d0" # token entity.name.function (for entity.name.function.preprocessor)
property = "#d8dee9" # token variable.other (for variable.other.property)
comment = "#616e88" # token comment (for comment.line)
meta = "#81a1c1" # token storage (for storage.type.annotation)
invalid = "#bf616a" # editorError.foreground
warning = "#ebcb8b" # editorWarning.foreground

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#a3be8c" # editorGutter.addedBackground
removed = "#bf616a" # editorGutter.deletedBackground
changed = "#ebcb8b" # editorGutter.modifiedBackground
