# Nightfox, converted to a Skiff Code theme.
# Source: https://github.com/EdenEast/nightfox.nvim at 4dacd3f0185a2227bdf3b6c0975a8f0bf87cac9a,
#   the highlight groups of :colorscheme nightfox, read in Neovim v0.12.4
# License: MIT, Copyright (c) 2021 James Simpson. The full text is in NOTICE.md of
#   https://github.com/bynaki/skiffcode-themes, written by scripts/generate.ts there from scripts/data/nightfox.json.
# The comment after each color names what in the source it came from.
base = "dark"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#131a24" # NormalFloat bg
foreground = "#cdcecf" # NormalFloat fg
muted = "#738091" # Comment fg
border = "#71839b" # FloatBorder fg
faint = "#39506d" # NonText fg
subtle = "#29394f" # CursorLine bg
accent = "#86abdc" # Function fg
scrim = "#19233099" # none in the source: editor.background at alpha 99
strong_background = "#3c5372" # PmenuSel bg
strong_foreground = "#cdcecf" # Pmenu fg
git_modified = "#dbc074" # NvimTreeGitDirty fg
git_untracked = "#81b29a" # NvimTreeGitNew fg

# The document: the code views and rendered markdown.
[editor]
background = "#192330" # Normal bg
foreground = "#cdcecf" # Normal fg
gutter_background = "#192330" # none in the source: editor.background
gutter_foreground = "#71839b" # LineNr fg
gutter_border = "#131a24" # WinSeparator fg
cursor = "#cdcecf" # Cursor bg
selection = "#2b3b51" # Visual bg
code_background = "#212e3f" # ColorColumn bg

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#9d79d6" # @keyword fg (via Keyword)
atom = "#f4a261" # @boolean fg (via Number)
literal = "#f4a261" # @number fg (via Number)
string = "#81b29a" # @string fg (via String)
regexp = "#e0c989" # @string.regexp fg
definition = "#86abdc" # @function fg (via Function)
local = "#7ad5d6" # @variable.parameter fg
type = "#dbc074" # @type fg (via Type)
class = "#dbc074" # @lsp.type.class fg (via Type)
macro = "#c94f6d" # @function.macro fg
property = "#719cd6" # @property fg
comment = "#738091" # @comment fg (via Comment)
meta = "#f6b079" # @attribute fg (via Constant)
invalid = "#c94f6d" # DiagnosticError fg
warning = "#dbc074" # DiagnosticWarn fg

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#81b29a" # GitSignsAdd fg
removed = "#c94f6d" # GitSignsDelete fg
changed = "#dbc074" # GitSignsChange fg
